schema_version: featureliftbench.ecsm_pilot.v1
pilot_id: ecsm-pilot-v1
preregistration_date: 2026-07-13
taxonomy_version: v1
research_question: >-
  Does an explicit executable closure state with expand, probe, counterfactual
  prune, risk comparison, and guarded stopping improve hidden correctness and
  compactness beyond a FeatureLift-specific strong prompt?

corpus_policy:
  hidden_tests_visible_to_agent: false
  evaluator_files_visible_to_agent: false
  oracle_arms_may_use: [metadata.json, evaluation/closure_gold.json, evaluation/oracle_manifest.json]
  oracle_arms_may_not_use: [hidden_tests, evaluation logs, prior submission code]
  note: Oracle metadata is converted to prompt hints before the agent starts.

controls:
  model: deepseek/deepseek-v4-flash
  agent: openhands-agent
  agent_profile: openhands_deepseek_v4_flash
  agent_config: harness/config/agents.toml
  env_file: .env
  agent_backend: local
  eval_backend: docker
  eval_docker_image: featureliftbench-eval:latest
  context_window_tokens: 131072
  reserved_output_tokens: 8192
  per_instance_total_token_budget: 6000000
  max_steps: 120
  timeout_seconds: 3600
  temperature: 0
  repetitions: 1
  seeds: [0]
  tools: [file_editor, terminal, task_tracker, think, finish]
  test_permissions: public_tests_only
  submission_protocol: submission/featurelifted
  network_for_agent: profile_default
  network_for_evaluator: none
  condition_difference_policy: prompt appendix and generated non-hidden hints only

execution:
  block: task
  arm_order: deterministic_shuffle_within_task
  random_seed: 20260713
  continue_after_failed_cell: true
  output_root: experiments/methods/ecsm_pilot/runs
  freeze_manifest: experiments/methods/ecsm_pilot/pilot_freeze_manifest.json
  resource_decision: artifacts/research_analysis/ecsm_pilot/stage_b_resource_decision.json

stages:
  A:
    purpose: pipeline smoke only
    task_ids: [boltons__iterutils_core__001, schema__nested_validate_core__hard3_001]
    arm_ids: [standard, strong_prompt, oracle_locate, static_closure_hint, oracle_closure, copy_first_then_prune, ecsm]
    expected_cells: 14
  B:
    purpose: resource allocation signal only; not a paper mechanism conclusion
    task_ids: [pluggy__hook_specs_core__001, pydantic_v1__validation_error_core__001, lark__grammar_loader_core__001, websockets__handshake_parse_core__001]
    arm_ids: [standard, strong_prompt, oracle_locate, oracle_closure, ecsm]
    expected_cells: 20
  C:
    purpose: complement of A and B needed to complete the frozen 70-cell matrix
    requires_resource_decision: true
    expected_cells: 36

task_selection:
  source: artifacts/research_analysis/python150_task_taxonomy.csv
  outcome_fields_used: false
  policy:
    task_count: 10
    minimum_unique_source_repos: 8
    minimum_feature_families: 5
    minimum_static_cross_file_closure: 2
    minimum_framework_lifecycle: 2
    minimum_global_state_registry: 2
    minimum_config_environment_or_resource: 1
    minimum_parser_stateful: 1
    simple_controls: 2
    require_reference_closure_for_all: true
    closure_depth_bins_required: [shallow_0_1, medium_2, deep_3_plus]
    maximum_parser_primary_share: 0.3
    maximum_curated_vibe_tasks: 1

arms:
  - id: standard
    label: Standard
    strategy: standard
    description: Unmodified frozen OpenHands FeatureLiftBench prompt.
  - id: strong_prompt
    label: Strong Prompt
    strategy: strong_prompt
    description: FeatureLift-specific checklist without oracle location or closure data.
  - id: oracle_locate
    label: Oracle Locate
    strategy: oracle_locate
    description: Gives source entrypoints and their source-file locations, but no transitive closure.
  - id: static_closure_hint
    label: Static Closure Hint
    strategy: static_closure_hint
    description: Gives a bounded AST-import candidate set derived from located files.
  - id: oracle_closure
    label: Oracle Closure
    strategy: oracle_closure
    description: Gives required source files and target API from oracle_manifest, never hidden tests.
  - id: copy_first_then_prune
    label: Copy-first then Prune
    strategy: copy_first_then_prune
    description: Requires conservative expansion followed by executable deletion tests.
  - id: ecsm
    label: ECSM-Prompt
    strategy: ecsm
    description: Structured prompt protocol requiring explicit closure state, executable probes, risk comparison, and guarded stopping; not a native controller.

tasks:
  - task_id: pluggy__hook_specs_core__001
    task_dir: benchmark/tasks/pluggy__hook_specs_core__001
    source_repo: pluggy
    feature_family: registry_plugin_dispatch
    feature_statefulness: lifecycle_state
    closure_depth: 2
    closure_depth_bin: medium_2
    mechanisms: [static_transitive_dependency, implicit_runtime_dependency, framework_lifecycle, global_state_registry, dynamic_import_plugin]
    selection_roles: [static_cross_file_closure, framework_lifecycle, global_state_registry]
  - task_id: pydantic_v1__validation_error_core__001
    task_dir: benchmark/tasks/pydantic_v1__validation_error_core__001
    source_repo: pydantic
    feature_family: validate_normalize_construct
    feature_statefulness: lifecycle_state
    closure_depth: 2
    closure_depth_bin: medium_2
    mechanisms: [static_transitive_dependency, implicit_runtime_dependency, data_model_invariant, framework_lifecycle, global_state_registry, dynamic_import_plugin]
    selection_roles: [static_cross_file_closure, framework_lifecycle, global_state_registry]
  - task_id: coverage__config_merge_core__001
    task_dir: benchmark/tasks/coverage__config_merge_core__001
    source_repo: coveragepy
    feature_family: config_resolve_discover
    feature_statefulness: lifecycle_state
    closure_depth: 2
    closure_depth_bin: medium_2
    mechanisms: [static_transitive_dependency, implicit_runtime_dependency, config_environment, framework_lifecycle, dynamic_import_plugin]
    selection_roles: [static_cross_file_closure, config_environment, framework_lifecycle]
  - task_id: lark__grammar_loader_core__001
    task_dir: benchmark/tasks/lark__grammar_loader_core__001
    source_repo: lark
    feature_family: resource_metadata_loading
    feature_statefulness: stateless
    closure_depth: 3
    closure_depth_bin: deep_3_plus
    mechanisms: [static_transitive_dependency, implicit_runtime_dependency, parser_state, resource_packaging, dynamic_import_plugin]
    selection_roles: [static_cross_file_closure, resource_packaging, deep_closure]
  - task_id: websockets__handshake_parse_core__001
    task_dir: benchmark/tasks/websockets__handshake_parse_core__001
    source_repo: websockets
    feature_family: protocol_state_transition
    feature_statefulness: session_state
    closure_depth: 1
    closure_depth_bin: shallow_0_1
    mechanisms: [static_transitive_dependency, implicit_runtime_dependency, data_model_invariant, parser_state]
    selection_roles: [static_cross_file_closure, parser_stateful, shallow_closure]
  - task_id: boltons__iterutils_core__001
    task_dir: benchmark/tasks/boltons__iterutils_core__001
    source_repo: boltons
    feature_family: algorithm_data_structure
    feature_statefulness: local_state
    closure_depth: 0
    closure_depth_bin: shallow_0_1
    mechanisms: [data_model_invariant, parser_state]
    selection_roles: [simple_control, shallow_closure]
  - task_id: schema__nested_validate_core__hard3_001
    task_dir: benchmark/tasks/schema__nested_validate_core__hard3_001
    source_repo: schema
    feature_family: validate_normalize_construct
    feature_statefulness: stateless
    closure_depth: 0
    closure_depth_bin: shallow_0_1
    mechanisms: [data_model_invariant, parser_state]
    selection_roles: [simple_control, shallow_closure]
  - task_id: requests_cache__cache_key_core__hard3_001
    task_dir: benchmark/tasks/requests_cache__cache_key_core__hard3_001
    source_repo: requests_cache
    feature_family: cache_retry_policy
    feature_statefulness: stateless
    closure_depth: 1
    closure_depth_bin: shallow_0_1
    mechanisms: [static_transitive_dependency, implicit_runtime_dependency, data_model_invariant, third_party_contract]
    selection_roles: [static_cross_file_closure, third_party_contract]
  - task_id: sqlparse__format_filters_core__001
    task_dir: benchmark/tasks/sqlparse__format_filters_core__001
    source_repo: sqlparse
    feature_family: serialize_format_render
    feature_statefulness: local_state
    closure_depth: 4
    closure_depth_bin: deep_3_plus
    mechanisms: [static_transitive_dependency, implicit_runtime_dependency, data_model_invariant, parser_state]
    selection_roles: [static_cross_file_closure, deep_closure]
  - task_id: celery__signal_dispatch_core__hard3_001
    task_dir: benchmark/tasks/celery__signal_dispatch_core__hard3_001
    source_repo: celery
    feature_family: registry_plugin_dispatch
    feature_statefulness: global_state
    closure_depth: 0
    closure_depth_bin: shallow_0_1
    mechanisms: [framework_lifecycle, global_state_registry]
    selection_roles: [framework_lifecycle, global_state_registry, shallow_closure]

metrics:
  primary:
    - hidden_pass_at_1
    - public_hidden_gap
    - closure_f1
  secondary:
    - extraction_ratio
    - closure_precision
    - closure_recall
    - final_score
    - total_tokens
    - tool_calls
    - repeated_file_reads
    - repeated_line_reads
    - repeated_terminal_commands
    - copied_file_count
    - copied_loc
    - copied_fraction
    - submitted_file_count
    - external_dependency_count
    - unapproved_external_dependency_count
    - path_leakage
    - compactness_class

analysis:
  comparison_arm: strong_prompt
  report_raw_and_environment_excluded: true
  contract_review_sensitivity: true
  bootstrap_seed: 20260713
  bootstrap_samples: 10000
