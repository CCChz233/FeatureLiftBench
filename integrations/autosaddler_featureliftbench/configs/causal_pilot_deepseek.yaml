schema_version: autosaddler/v2

# Minimal causal H0/H1 pilot: one known Flash functional train failure and one
# repo-disjoint Flash functional development failure. Skip install-only failures.
# Capped at four real OpenHands rollouts.
scenario:
  type: featureliftbench_openhands
  settings:
    benchmark_root: ../../../benchmark/hard50_pilot
    train_manifest: ../splits/causal_pilot_train.json
    development_manifest: ../splits/causal_pilot_development.json
    agent_config: ../../../harness/config/agents.example.toml
    agent_profile: openhands_deepseek_v4_flash_main
    env_file: ../../../.env
    eval_docker: true
    eval_docker_image: featureliftbench-eval:latest
    timeout_seconds: 3600
    max_infrastructure_retries: 0
    max_component_chars: 800
    max_total_chars: 2500
    max_evidence_events: 12
    max_evidence_chars: 8000
    runner_mode: openhands
    baseline:
      repository_inspection: __AUTOSADDLER_FLB_INACTIVE__
      implementation_strategy: __AUTOSADDLER_FLB_INACTIVE__
      self_verification: __AUTOSADDLER_FLB_INACTIVE__
      completion_and_recovery: __AUTOSADDLER_FLB_INACTIVE__
    fixture_target_component: ""
    fixture_improved_text: ""

optimization:
  task_selection:
    type: fixed
    batch_size: 1
  acceptance:
    type: matched_valid_strict_improvement
  development:
    type: full_on_accept
  ranking:
    type: mean_development_score
  budget:
    max_rollouts: 4
    max_iterations: 1
  diagnosis_patch_timeout_seconds: 180
  selection_timeout_seconds: 120
  reflection_timeout_seconds: 120
  session_retries: 1
  session_retry_backoff_seconds: 10

provider:
  type: deepseek_inline
  capabilities: [read_workspace, edit_workspace, load_skills]
  settings:
    model: deepseek/deepseek-v4-flash
    api_key_env: FEATURELIFTBENCH_API_KEY
    api_base_env: FEATURELIFTBENCH_API_BASE
    max_tokens: 8192
    temperature: 0

storage:
  type: local
  run_root: ../../../experiments/methods/autosaddler_flb/causal_pilot_runs
