schema_version: autosaddler/v2

# Real OpenHands + Docker evaluator smoke with a deterministic optimizer patch.
# This validates the paid rollout path using only the existing FeatureLiftBench
# credential. It is not an effectiveness result for learned AutoSaddler patches.
scenario:
  type: featureliftbench_openhands
  settings:
    benchmark_root: ../../../benchmark/sanity
    train_manifest: splits/real_smoke_train.json
    development_manifest: splits/real_smoke_development.json
    agent_config: ../../../harness/config/agents.toml
    agent_profile: openhands_deepseek_v4_flash
    env_file: ../../../.env
    eval_docker: true
    eval_docker_image: featureliftbench-eval:latest
    timeout_seconds: 1800
    max_infrastructure_retries: 0
    max_component_chars: 800
    max_total_chars: 2500
    max_evidence_events: 30
    max_evidence_chars: 30000
    runner_mode: openhands
    baseline:
      repository_inspection: __AUTOSADDLER_FLB_INACTIVE__
      implementation_strategy: __AUTOSADDLER_FLB_INACTIVE__
      self_verification: __AUTOSADDLER_FLB_INACTIVE__
      completion_and_recovery: __AUTOSADDLER_FLB_INACTIVE__
    fixture_target_component: self_verification
    fixture_improved_text: Verify the completed package against every public behavior and required API before finishing.

optimization:
  task_selection:
    type: fixed
    batch_size: 1
  acceptance:
    type: matched_valid_strict_improvement
  development:
    type: full_on_accept
  ranking:
    type: mean_development_score
  budget:
    max_rollouts: 10
    max_iterations: 1
  diagnosis_patch_timeout_seconds: 30
  selection_timeout_seconds: 30
  reflection_timeout_seconds: 30
  session_retries: 0
  session_retry_backoff_seconds: 0

provider:
  type: fake
  capabilities: [read_workspace, edit_workspace, load_skills]
  settings: {}

storage:
  type: local
  run_root: ../../../experiments/methods/autosaddler_flb/real_smoke_runs

