schema_version: autosaddler/v2

# This template performs real OpenHands + Docker-evaluator rollouts. It deliberately
# uses an AutoSaddler-supported optimizer provider rather than adding a provider to
# either core project. Copy it to an untracked config before changing credentials or model.
scenario:
  type: featureliftbench_openhands
  settings:
    benchmark_root: ../../../benchmark/tasks
    train_manifest: splits/smoke_train.json
    development_manifest: splits/smoke_development.json
    agent_config: ../../../harness/config/agents.toml
    agent_profile: openhands_deepseek_v4_flash
    env_file: ../../../.env
    eval_docker: true
    eval_docker_image: featureliftbench-eval:latest
    timeout_seconds: 3600
    max_infrastructure_retries: 1
    max_component_chars: 800
    max_total_chars: 2500
    max_evidence_events: 30
    max_evidence_chars: 30000
    runner_mode: openhands
    baseline:
      repository_inspection: __AUTOSADDLER_FLB_INACTIVE__
      implementation_strategy: __AUTOSADDLER_FLB_INACTIVE__
      self_verification: __AUTOSADDLER_FLB_INACTIVE__
      completion_and_recovery: __AUTOSADDLER_FLB_INACTIVE__
    fixture_target_component: ""
    fixture_improved_text: ""

optimization:
  task_selection:
    type: fixed
    batch_size: 2
  acceptance:
    type: matched_valid_strict_improvement
  development:
    type: full_on_accept
  ranking:
    type: mean_development_score
  budget:
    max_rollouts: 20
    max_iterations: 1
  diagnosis_patch_timeout_seconds: 600
  selection_timeout_seconds: 300
  reflection_timeout_seconds: 300
  session_retries: 1
  session_retry_backoff_seconds: 15

provider:
  type: claude
  capabilities: [read_workspace, edit_workspace, load_skills]
  settings:
    model: claude-opus-4-6
    effort: high
    permission_mode: bypassPermissions
    base_url: https://api.anthropic.com

storage:
  type: local
  run_root: ../../../experiments/methods/autosaddler_flb/real_runs
