aliases = ["v1"]
status = "cost_arm"
paper_table = false
spec = "harness/config/methods/v1.json"
docs = "docs/METHOD_V1.md"
description = "Main plus a 2M total-token cap. Cost arm, not the unreleased Python-200' table."
