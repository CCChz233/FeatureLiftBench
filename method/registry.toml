schema = "featureliftbench.method_registry.v1"
description = """
Public method catalog. --arm is an alias of --method. run_agent_flags are
passed to featureliftbench.cli run-agent. profiles maps agent registry id to
an agents.example.toml profile. Official paper Main is method=main with
agent=openhands. Scaffolding and screening methods stay listed so old runs
can be reproduced; do not expand them onto Python-200'.
"""

[methods.main]
aliases = ["main", "nopublic", "no_public", "no-public"]
status = "official"
paper_table = true
docs = "docs/EVALUATION.md"
description = "Official No-Hint Full-Repository Main."
run_agent_flags = [
  "--no-agent-source-hints",
  "--no-agent-public-tests",
  "--prompt-style", "standard",
  "--source-context", "full_repository",
  "--no-td-cognition",
  "--no-exec-contract",
  "--no-self-contract",
  "--no-test-first-lift",
]

[methods.main.profiles]
openhands = "openhands_deepseek_v4_flash_main"
"deepseek-harness" = "dsh_deepseek_v4_flash_main"
codex = "codex_deepseek_v4_flash_main"

